<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>냥도감 관리자 | 공지사항</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root {
        color-scheme: light;
        --ink: #211916;
        --muted: #75685f;
        --paper: #fff7ea;
        --surface: #ffffff;
        --line: #eadccd;
        --clay: #c86f47;
        --green: #386b58;
        --danger: #9f3a21;
        --shadow: 0 18px 48px rgba(36, 27, 23, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid rgba(234, 220, 205, 0.82);
        padding: 14px clamp(18px, 4vw, 52px);
        background: rgba(255, 247, 234, 0.9);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 950;
      }

      .brand img {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        box-shadow: 0 8px 20px rgba(90, 57, 40, 0.14);
      }

      .topbar-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .page {
        width: min(1180px, 100%);
        margin: 0 auto;
        padding: 48px clamp(18px, 4vw, 52px) 80px;
      }

      .page-head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(34px, 5vw, 58px);
        line-height: 1.06;
        font-weight: 950;
      }

      .subtitle {
        max-width: 720px;
        margin-top: 14px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.7;
        font-weight: 750;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .login-panel {
        width: min(480px, 100%);
        padding: 24px;
      }

      .login-panel h2,
      .table-panel h2 {
        font-size: 22px;
        font-weight: 950;
      }

      .form {
        display: grid;
        gap: 14px;
        margin-top: 18px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
      }

      .input,
      .select {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        background: #fff;
        color: var(--ink);
        font-size: 14px;
        font-weight: 800;
      }

      .input:focus,
      .select:focus {
        outline: 3px solid rgba(56, 107, 88, 0.18);
        border-color: rgba(56, 107, 88, 0.48);
      }

      .button {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ink);
        border-radius: 8px;
        padding: 0 14px;
        background: var(--ink);
        color: #fff;
        font-size: 14px;
        font-weight: 950;
        white-space: nowrap;
      }

      .button.secondary {
        border-color: var(--line);
        background: rgba(255, 255, 255, 0.84);
        color: var(--ink);
      }

      .button.ghost {
        border-color: transparent;
        background: transparent;
        color: var(--muted);
      }

      .status {
        min-height: 22px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 800;
        line-height: 1.55;
      }

      .status[data-state="success"] {
        color: var(--green);
      }

      .status[data-state="error"] {
        color: var(--danger);
      }

      .table-panel {
        overflow: hidden;
      }

      .table-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        padding: 18px;
      }

      .summary {
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
      }

      .filters {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) minmax(120px, 160px) minmax(120px, 160px) auto;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        padding: 14px 18px;
        background: rgba(255, 247, 234, 0.56);
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 920px;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid rgba(234, 220, 205, 0.78);
        padding: 12px 14px;
        text-align: left;
        vertical-align: middle;
        font-size: 14px;
      }

      th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 950;
        white-space: nowrap;
      }

      td {
        font-weight: 760;
      }

      .email {
        font-weight: 950;
      }

      .tag {
        display: inline-flex;
        min-height: 26px;
        align-items: center;
        border: 1px solid rgba(234, 220, 205, 0.94);
        border-radius: 999px;
        padding: 0 9px;
        background: rgba(255, 247, 234, 0.78);
        color: var(--muted);
        font-size: 12px;
        font-weight: 950;
      }

      .empty {
        padding: 42px 18px;
        color: var(--muted);
        text-align: center;
        font-weight: 850;
      }

      .pagination {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 760px) {
        .topbar,
        .page-head,
        .table-head,
        .pagination {
          align-items: stretch;
          flex-direction: column;
        }

        .filters {
          grid-template-columns: 1fr;
        }

        .topbar-actions {
          justify-content: flex-start;
        }
      }
    </style>

    <style>
      .textarea {
        width: 100%;
        min-height: 190px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        line-height: 1.6;
        resize: vertical;
      }
      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
      }
      .hint {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }
      .badge.live { background: #e4f0ea; color: var(--green); }
      .badge.scheduled { background: #fdeedd; color: var(--clay); }
      .badge.draft { background: #efe9e3; color: var(--muted); }
      .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      @media (max-width: 720px) {
        .field-row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="../index.html">
        <img src="../assets/catdex-app-icon.png" alt="" />
        <span>냥도감 관리자</span>
      </a>
      <div class="topbar-actions">
        <a class="button secondary" href="./index.html">출시 알림 신청자</a>
        <button class="button ghost hidden" type="button" data-logout>로그아웃</button>
      </div>
    </header>

    <main class="page">
      <section class="page-head">
        <div>
          <h1>공지사항</h1>
          <p class="subtitle">관리자로 등록된 계정만 공지를 쓰고 고칠 수 있습니다. 올린 공지는 앱 마이페이지 &gt; 공지사항에 바로 보입니다.</p>
        </div>
      </section>

<section class="panel login-panel" data-login-panel>
        <h2>관리자 로그인</h2>
        <form class="form" data-login-form>
          <label class="field">
            <span class="label">이메일</span>
            <input class="input" name="email" type="email" autocomplete="username" required />
          </label>
          <label class="field">
            <span class="label">비밀번호</span>
            <input class="input" name="password" type="password" autocomplete="current-password" required />
          </label>
          <button class="button" type="submit">로그인</button>
          <button class="button ghost" type="button" data-reset-password>비밀번호 재설정 메일 받기</button>
          <p class="status" data-login-status role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel login-panel hidden" data-password-panel>
        <h2>새 비밀번호 설정</h2>
        <form class="form" data-password-form>
          <label class="field">
            <span class="label">새 비밀번호</span>
            <input class="input" name="password" type="password" autocomplete="new-password" minlength="12" required />
          </label>
          <button class="button" type="submit">비밀번호 저장</button>
          <p class="status" data-password-status role="status" aria-live="polite"></p>
        </form>
      </section>

            <section class="panel hidden" data-admin-panel>
        <div class="table-head">
          <div>
            <h2 data-editor-title>새 공지 쓰기</h2>
            <p class="summary" data-editor-summary>앱 마이페이지 &gt; 공지사항에 그대로 올라갑니다.</p>
          </div>
          <div class="topbar-actions">
            <button class="button ghost hidden" type="button" data-cancel-edit>새로 쓰기로 돌아가기</button>
          </div>
        </div>

        <form class="form" data-announcement-form>
          <label class="field">
            <span class="label">제목</span>
            <input class="input" name="title" type="text" maxlength="80" required />
          </label>
          <label class="field">
            <span class="label">본문</span>
            <textarea class="textarea" name="body" required></textarea>
            <p class="hint">줄바꿈은 그대로 보입니다. 링크는 주소를 그대로 적어 주세요.</p>
          </label>
          <div class="field-row">
            <label class="field">
              <span class="label">공개 시각</span>
              <input class="input" name="publishedAt" type="datetime-local" />
              <p class="hint">비우면 초안으로 저장돼 앱에 보이지 않습니다. 미래 시각이면 그때 열립니다.</p>
            </label>
            <div class="field">
              <span class="label">옵션</span>
              <label class="check">
                <input name="pinned" type="checkbox" />
                <span>목록 맨 위에 고정</span>
              </label>
              <button class="button secondary" type="button" data-publish-now>지금 시각으로 채우기</button>
            </div>
          </div>
          <button class="button" type="submit" data-submit>공지 올리기</button>
          <p class="status" data-form-status role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel table-panel hidden" data-list-panel>
        <div class="table-head">
          <div>
            <h2>올린 공지</h2>
            <p class="summary" data-summary>불러오는 중</p>
          </div>
          <div class="topbar-actions">
            <button class="button" type="button" data-refresh>새로고침</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>제목</th>
                <th>상태</th>
                <th>공개 시각</th>
                <th>수정일</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody data-table-body></tbody>
          </table>
          <div class="empty hidden" data-empty>아직 올린 공지가 없습니다.</div>
        </div>
      </section>
    </main>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      const supabaseUrl = "https://wqiqdybzhbmsvccpklli.supabase.co";
      const supabasePublishableKey = "sb_publishable_MISNyBxkkXHU7zAjSBl2Ow_nQ4yzCyp";

      const supabase = createClient(supabaseUrl, supabasePublishableKey, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
        },
      });

      const loginPanel = document.querySelector("[data-login-panel]");
      const passwordPanel = document.querySelector("[data-password-panel]");
      const adminPanel = document.querySelector("[data-admin-panel]");
      const listPanel = document.querySelector("[data-list-panel]");
      const logoutButton = document.querySelector("[data-logout]");
      const loginForm = document.querySelector("[data-login-form]");
      const loginStatus = document.querySelector("[data-login-status]");
      const passwordForm = document.querySelector("[data-password-form]");
      const passwordStatus = document.querySelector("[data-password-status]");
      const resetPasswordButton = document.querySelector("[data-reset-password]");

      const announcementForm = document.querySelector("[data-announcement-form]");
      const formStatus = document.querySelector("[data-form-status]");
      const editorTitle = document.querySelector("[data-editor-title]");
      const cancelEditButton = document.querySelector("[data-cancel-edit]");
      const publishNowButton = document.querySelector("[data-publish-now]");
      const submitButton = document.querySelector("[data-submit]");
      const tableBody = document.querySelector("[data-table-body]");
      const emptyBox = document.querySelector("[data-empty]");
      const summary = document.querySelector("[data-summary]");
      const refreshButton = document.querySelector("[data-refresh]");

      let isPasswordRecovery = false;
      /** 수정 중인 공지 id. null이면 새 글. */
      let editingId = null;

      function setLoginStatus(message, state = "") {
        loginStatus.textContent = message;
        loginStatus.dataset.state = state;
      }

      function setPasswordStatus(message, state = "") {
        passwordStatus.textContent = message;
        passwordStatus.dataset.state = state;
      }

      function setAuthenticatedView(isAuthenticated) {
        loginPanel.classList.toggle("hidden", isAuthenticated);
        passwordPanel.classList.add("hidden");
        adminPanel.classList.toggle("hidden", !isAuthenticated);
        logoutButton.classList.toggle("hidden", !isAuthenticated);
      }

      function setPasswordRecoveryView() {
        loginPanel.classList.add("hidden");
        passwordPanel.classList.remove("hidden");
        adminPanel.classList.add("hidden");
        logoutButton.classList.add("hidden");
      }


      function setAuthenticatedView(isAuthenticated) {
        loginPanel.classList.toggle("hidden", isAuthenticated);
        passwordPanel.classList.add("hidden");
        adminPanel.classList.toggle("hidden", !isAuthenticated);
        listPanel.classList.toggle("hidden", !isAuthenticated);
        logoutButton.classList.toggle("hidden", !isAuthenticated);
      }

      function setFormStatus(message, state = "") {
        formStatus.textContent = message;
        formStatus.dataset.state = state;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function formatDateTime(value) {
        if (!value) {
          return "-";
        }

        const parsed = new Date(value);

        if (Number.isNaN(parsed.getTime())) {
          return value;
        }

        const pad = (n) => String(n).padStart(2, "0");

        return `${parsed.getFullYear()}.${pad(parsed.getMonth() + 1)}.${pad(parsed.getDate())} ${pad(parsed.getHours())}:${pad(parsed.getMinutes())}`;
      }

      /** datetime-local은 브라우저 현지 시각 문자열을 쓴다. 서버는 UTC로 받는다. */
      function toLocalInputValue(isoValue) {
        if (!isoValue) {
          return "";
        }

        const parsed = new Date(isoValue);

        if (Number.isNaN(parsed.getTime())) {
          return "";
        }

        const pad = (n) => String(n).padStart(2, "0");

        return `${parsed.getFullYear()}-${pad(parsed.getMonth() + 1)}-${pad(parsed.getDate())}T${pad(parsed.getHours())}:${pad(parsed.getMinutes())}`;
      }

      function describeState(publishedAt) {
        if (!publishedAt) {
          return '<span class="badge draft">초안</span>';
        }

        return new Date(publishedAt) > new Date()
          ? '<span class="badge scheduled">예약</span>'
          : '<span class="badge live">공개</span>';
      }

      function resetEditor() {
        editingId = null;
        announcementForm.reset();
        editorTitle.textContent = "새 공지 쓰기";
        submitButton.textContent = "공지 올리기";
        cancelEditButton.classList.add("hidden");
        setFormStatus("");
      }

      function startEditing(announcement) {
        editingId = announcement.id;
        announcementForm.elements.title.value = announcement.title;
        announcementForm.elements.body.value = announcement.body;
        announcementForm.elements.publishedAt.value = toLocalInputValue(announcement.published_at);
        announcementForm.elements.pinned.checked = Boolean(announcement.pinned);
        editorTitle.textContent = "공지 고치기";
        submitButton.textContent = "수정 저장";
        cancelEditButton.classList.remove("hidden");
        setFormStatus("");
        announcementForm.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function renderRows(rows) {
        tableBody.innerHTML = rows
          .map(
            (row) => `
              <tr>
                <td>${escapeHtml(row.title)}${row.pinned ? ' <span class="tag">고정</span>' : ""}</td>
                <td>${describeState(row.published_at)}</td>
                <td>${formatDateTime(row.published_at)}</td>
                <td>${formatDateTime(row.updated_at)}</td>
                <td>
                  <div class="row-actions">
                    <button class="button secondary" type="button" data-edit="${row.id}">수정</button>
                    <button class="button ghost" type="button" data-delete="${row.id}">삭제</button>
                  </div>
                </td>
              </tr>`,
          )
          .join("");

        emptyBox.classList.toggle("hidden", rows.length > 0);
      }

      let loadedRows = [];

      async function loadAnnouncements() {
        summary.textContent = "불러오는 중";

        const { data, error } = await supabase
          .from("announcements")
          .select("id, title, body, published_at, pinned, updated_at")
          .order("pinned", { ascending: false })
          .order("published_at", { ascending: false, nullsFirst: true })
          .order("updated_at", { ascending: false });

        if (error) {
          summary.textContent = "";
          setFormStatus(`목록을 불러오지 못했습니다: ${error.message}`, "error");
          return;
        }

        loadedRows = data ?? [];
        renderRows(loadedRows);

        const live = loadedRows.filter(
          (row) => row.published_at && new Date(row.published_at) <= new Date(),
        ).length;

        summary.textContent = `${loadedRows.length}건 · 공개 ${live}건`;
      }

      announcementForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const title = announcementForm.elements.title.value.trim();
        const body = announcementForm.elements.body.value.trim();
        const publishedInput = announcementForm.elements.publishedAt.value;

        if (!title || !body) {
          setFormStatus("제목과 본문을 채워 주세요.", "error");
          return;
        }

        const payload = {
          title,
          body,
          published_at: publishedInput ? new Date(publishedInput).toISOString() : null,
          pinned: announcementForm.elements.pinned.checked,
        };

        submitButton.disabled = true;
        setFormStatus("저장하는 중…");

        const { error } = editingId
          ? await supabase.from("announcements").update(payload).eq("id", editingId)
          : await supabase.from("announcements").insert(payload);

        submitButton.disabled = false;

        if (error) {
          // RLS가 막으면 권한 문제다. 관리자로 등록되지 않은 계정이 흔한 원인이다.
          setFormStatus(`저장하지 못했습니다: ${error.message}`, "error");
          return;
        }

        resetEditor();
        setFormStatus("저장했습니다.", "success");
        await loadAnnouncements();
      });

      tableBody.addEventListener("click", async (event) => {
        const editId = event.target.closest("[data-edit]")?.dataset.edit;
        const deleteId = event.target.closest("[data-delete]")?.dataset.delete;

        if (editId) {
          const row = loadedRows.find((item) => item.id === editId);

          if (row) {
            startEditing(row);
          }

          return;
        }

        if (!deleteId) {
          return;
        }

        const row = loadedRows.find((item) => item.id === deleteId);

        if (!window.confirm(`'${row?.title ?? "이 공지"}'를 삭제할까요? 되돌릴 수 없습니다.`)) {
          return;
        }

        const { error } = await supabase.from("announcements").delete().eq("id", deleteId);

        if (error) {
          setFormStatus(`삭제하지 못했습니다: ${error.message}`, "error");
          return;
        }

        if (editingId === deleteId) {
          resetEditor();
        }

        await loadAnnouncements();
      });

      publishNowButton.addEventListener("click", () => {
        announcementForm.elements.publishedAt.value = toLocalInputValue(new Date().toISOString());
      });

      cancelEditButton.addEventListener("click", resetEditor);
      refreshButton.addEventListener("click", () => {
        void loadAnnouncements();
      });

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        setLoginStatus("로그인 중…");

        const email = loginForm.elements.email.value.trim();
        const password = loginForm.elements.password.value;
        const { error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          setLoginStatus(`로그인하지 못했습니다: ${error.message}`, "error");
          return;
        }

        setLoginStatus("");
        loginForm.reset();
        setAuthenticatedView(true);
        await loadAnnouncements();
      });

      resetPasswordButton.addEventListener("click", async () => {
        const email = loginForm.elements.email.value.trim();

        if (!email) {
          setLoginStatus("이메일을 먼저 입력해 주세요.", "error");
          return;
        }

        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.href,
        });

        setLoginStatus(
          error ? `메일을 보내지 못했습니다: ${error.message}` : "재설정 메일을 보냈습니다.",
          error ? "error" : "success",
        );
      });

      passwordForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        setPasswordStatus("저장하는 중…");

        const password = passwordForm.elements.password.value;
        const { error } = await supabase.auth.updateUser({ password });

        if (error) {
          setPasswordStatus(`저장하지 못했습니다: ${error.message}`, "error");
          return;
        }

        isPasswordRecovery = false;
        passwordForm.reset();
        setPasswordStatus("");
        setAuthenticatedView(true);
        await loadAnnouncements();
      });

      logoutButton.addEventListener("click", async () => {
        await supabase.auth.signOut();
        setAuthenticatedView(false);
        setLoginStatus("");
      });

      supabase.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY") {
          isPasswordRecovery = true;
          setPasswordRecoveryView();
        }
      });

      const {
        data: { session },
      } = await supabase.auth.getSession();

      if (!isPasswordRecovery) {
        setAuthenticatedView(Boolean(session));
      }

      if (session && !isPasswordRecovery) {
        await loadAnnouncements();
      }
    </script>
  </body>
</html>
